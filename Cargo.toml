[package]
name = "mdhl"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/adduc/mdhl"
description = "Highlight Markdown as ANSI-colored text on the terminal"

[dependencies]
pulldown-cmark = "0.13.4"
