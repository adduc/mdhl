name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs on the same branch or PR are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  # Keep in step with `rust-version` in Cargo.toml. 1.95 is the first release
  # with stable `if let` guards on match arms.
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --locked

  # Catches a missed bump before the release tag does.
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: packaging/check-version.sh
