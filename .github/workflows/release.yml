name: Release

# Pushing a tag like v1.2.0 builds Fedora RPMs and static Linux tarballs and
# attaches them to a GitHub release for that tag. Bump the version in
# Cargo.toml and the spec file first; the build stops if they disagree.
#
# Every pull request runs the same builds and assembles the release files
# without publishing, so a broken release is caught before tagging. Only the
# upload to GitHub is left for the tag.
on:
  push:
    tags: ["v*"]
  pull_request:

# A newer push to a pull request cancels its older run. Tag runs are never
# cancelled, so a release can't be left half published.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Packaging metadata that has to agree with the code. CI doesn't repeat
  # these, since this workflow runs on every pull request.
  packaging:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # On a tag, the tag must match too.
      - name: Check the version
        run: packaging/check-version.sh ${TAG:+"$TAG"}
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      - name: Check the spec's License
        run: packaging/check-license.sh

  rpm:
    needs: packaging
    strategy:
      matrix:
        # Keep in step with the list in the assemble job. The source RPM is
        # the same for every release, so only the newest one ships it.
        include:
          - fedora: 44
          - fedora: 45
            srpm: true
    runs-on: ubuntu-24.04
    container: fedora:${{ matrix.fedora }}
    steps:
      - name: Install build tools
        run: dnf install -y git make rpm-build cargo-rpm-macros

      - uses: actions/checkout@v7

      # The checkout is owned by a different user than the container's root.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - run: make rpm

      # The source RPM carries the vendored crates, so it rebuilds offline.
      # debuginfo and debugsource are left out; they're only useful with a
      # debuginfo repository behind them.
      - name: Collect RPMs
        env:
          SRPM: ${{ matrix.srpm && 'true' || '' }}
        run: |
          mkdir dist
          dirs=(target/rpmbuild/RPMS)
          if [ -n "$SRPM" ]; then
            dirs+=(target/rpmbuild/SRPMS)
          fi
          find "${dirs[@]}" -name '*.rpm' \
              ! -name '*-debuginfo-*' ! -name '*-debugsource-*' \
              -exec cp {} dist/ \;
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: rpm-fc${{ matrix.fedora }}
          path: dist/
          if-no-files-found: error

  # Static musl binaries for every other distribution. Each architecture
  # builds natively on its own runner.
  tarball:
    needs: packaging
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-unknown-linux-musl

      - run: make dist RUST_TARGET=${{ matrix.arch }}-unknown-linux-musl

      # Fails if the binary picked up a dynamic loader.
      - name: Check the binary is static and runs
        run: |
          bin=target/${{ matrix.arch }}-unknown-linux-musl/release/mdhl
          file "$bin"
          file "$bin" | grep -q 'static'
          "$bin" --version

      - uses: actions/upload-artifact@v7
        with:
          name: tarball-${{ matrix.arch }}
          path: target/dist/*.tar.gz
          if-no-files-found: error

  # Gathers every build's output, checks it is exactly the set of files a
  # release should carry, and adds SHA256SUMS. Runs on pull requests too, so
  # all of the release except the upload is tested before tagging.
  assemble:
    needs: [rpm, tarball]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Check the release files
        run: |
          version=$(packaging/version.sh)
          rpm=$(packaging/version.sh --rpm-release)
          {
            for fedora in 44 45; do
              echo "mdhl-$rpm.fc$fedora.x86_64.rpm"
            done
            echo "mdhl-$rpm.fc45.src.rpm"
            for arch in x86_64 aarch64; do
              echo "mdhl-$version-$arch-linux.tar.gz"
            done
          } | sort > expected
          (cd dist && ls -1) | sort > actual
          if ! diff -u expected actual; then
            echo "dist/ doesn't hold the expected release files (- missing, + unexpected)" >&2
            exit 1
          fi

      - name: Write checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: dist/
          if-no-files-found: error

  # Only this job can write to the repository, and only on a tag.
  publish:
    if: github.ref_type == 'tag'
    needs: assemble
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist

      # A tag with a pre-release suffix, like v0.2.0-rc.1, is published as a
      # pre-release, so it isn't shown as the latest release.
      - name: Publish release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=
          case $GITHUB_REF_NAME in *-*) prerelease=--prerelease ;; esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber -- *
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
                $prerelease -- *
          fi
